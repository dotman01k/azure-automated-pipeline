# Standalone pipeline for vm-scale-sets. Each Terraform action has a numbered stage.
trigger: none
pr: none
parameters:
- name: service
  type: string
  default: vm-scale-sets
  values: [vm-scale-sets]
- name: environment
  type: string
  default: dev
  values: [dev, prod]
- name: operation
  type: string
  default: plan
  values: [plan, apply]
- name: agentPool
  type: string
  default: InfraProject
- name: serviceConnection
  type: string
  default: sc-compute-dev
# Environment settings are selected from this Azure DevOps variable group.
variables:
- group: compute-${{ parameters.service }}-${{ parameters.environment }}
# Read the numbered Terraform stages below: Init, Validate, Plan, then approved Apply.
stages:
# Stage 1: initialize Terraform and check source formatting.
- stage: TerraformInit
  displayName: "Stage 1: Terraform Init"
  jobs:
  - job: InitSource
    pool:
      name: ${{ parameters.agentPool }}
      demands: Agent.OS -equals Windows_NT
    workspace:
      clean: all
    steps:
    - checkout: self
      clean: true
      persistCredentials: false
    - task: PowerShell@2
      inputs:
        pwsh: true
        filePath: scripts/Install-Terraform.ps1
    - task: PowerShell@2
      displayName: Run terraform fmt and terraform init
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          $root = $env:BUILD_SOURCESDIRECTORY
          Set-Location $root
          terraform fmt -check -recursive
          if ($LASTEXITCODE) { throw 'Terraform formatting failed.' }
          Set-Location (Join-Path $root "services/$env:SERVICE/environments/$env:TARGET_ENVIRONMENT")
          terraform init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE) { throw 'Terraform validation init failed.' }
      env:
        SERVICE: ${{ parameters.service }}
        TARGET_ENVIRONMENT: ${{ parameters.environment }}
# Stage 2: validate the selected environment and run input/policy tests.
- stage: TerraformValidate
  displayName: "Stage 2: Terraform Validate"
  dependsOn: TerraformInit
  jobs:
  - job: ValidateSource
    pool:
      name: ${{ parameters.agentPool }}
      demands: Agent.OS -equals Windows_NT
    workspace:
      clean: all
    steps:
    - checkout: self
      clean: true
      persistCredentials: false
    - task: PowerShell@2
      inputs:
        pwsh: true
        filePath: scripts/Install-Terraform.ps1
    - task: PowerShell@2
      displayName: Run terraform validate
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $ErrorActionPreference = 'Stop'
          $root = $env:BUILD_SOURCESDIRECTORY
          Set-Location (Join-Path $root "services/$env:SERVICE/environments/$env:TARGET_ENVIRONMENT")
          # Each stage has its own clean workspace, so initialize this job too.
          terraform init -backend=false -input=false -lockfile=readonly
          if ($LASTEXITCODE) { throw 'Terraform validation init failed.' }
          terraform validate -no-color
          if ($LASTEXITCODE) { throw 'Terraform validation failed.' }
          python "$root/scripts/validate_inputs.py" terraform.tfvars.json
          if ($LASTEXITCODE) { throw 'Input validation failed.' }
      env:
        SERVICE: ${{ parameters.service }}
        TARGET_ENVIRONMENT: ${{ parameters.environment }}
    - task: PowerShell@2
      inputs:
        pwsh: true
        targetType: inline
        script: |
          python -m pip install -r requirements-validation.txt
          if ($LASTEXITCODE) { throw 'Validation dependency installation failed.' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE) { throw 'Policy tests failed.' }
# Stage 3: create the saved Terraform plan for review.
- stage: TerraformPlan
  displayName: "Stage 3: Terraform Plan"
  dependsOn: TerraformValidate
  jobs:
  - job: CreatePlan
    pool:
      name: ${{ parameters.agentPool }}
      demands: Agent.OS -equals Windows_NT
    workspace:
      clean: all
    steps:
    - checkout: self
      clean: true
      persistCredentials: false
    - task: PowerShell@2
      inputs:
        pwsh: true
        filePath: scripts/Install-Terraform.ps1
    - task: AzureCLI@2
      displayName: Terraform init and plan
      inputs:
        azureSubscription: ${{ parameters.serviceConnection }}
        addSpnToEnvironment: true
        scriptType: pscore
        scriptLocation: inlineScript
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:BUILD_SOURCESDIRECTORY 'scripts/Invoke-Terraform.ps1'
          $artifactDirectory = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'approved-plan'
          & $helper -Service $env:SERVICE -Environment $env:TARGET_ENVIRONMENT -Operation plan -Phase Prepare -ArtifactDirectory $artifactDirectory
          terraform init -input=false -reconfigure -lockfile=readonly `
            "-backend-config=resource_group_name=$env:STATE_RESOURCE_GROUP" `
            "-backend-config=storage_account_name=$env:STATE_STORAGE_ACCOUNT" `
            "-backend-config=container_name=$env:STATE_CONTAINER" `
            "-backend-config=key=$env:TF_STATE_KEY" `
            -backend-config=use_azuread_auth=true -backend-config=use_oidc=true
          if ($LASTEXITCODE) { throw 'Terraform backend init failed.' }
          New-Item -ItemType Directory -Path $artifactDirectory -Force | Out-Null
          terraform plan -input=false -lock-timeout=120s "-out=$artifactDirectory/platform.tfplan"
          if ($LASTEXITCODE) { throw 'Terraform plan failed.' }
          # Reject destructive plans and record the saved-plan hash/provenance.
          & $helper -Service $env:SERVICE -Environment $env:TARGET_ENVIRONMENT -Operation plan -Phase RecordPlan -ArtifactDirectory $artifactDirectory
        visibleAzLogin: false
      env:
        SERVICE: ${{ parameters.service }}
        TARGET_ENVIRONMENT: ${{ parameters.environment }}
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
        ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: $(AZURE_SERVICE_CONNECTION_ID)
        STATE_RESOURCE_GROUP: $(STATE_RESOURCE_GROUP)
        STATE_STORAGE_ACCOUNT: $(STATE_STORAGE_ACCOUNT)
        STATE_CONTAINER: $(STATE_CONTAINER)
        TF_SECRET_JSON: $(TF_SECRET_JSON)
    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: $(Build.ArtifactStagingDirectory)/approved-plan
        artifact: approved-plan
# Stage 4: apply only the reviewed saved plan after environment approval.
- stage: TerraformApply
  displayName: "Stage 4: Terraform Apply"
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq('${{ parameters.operation }}', 'apply'), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  lockBehavior: sequential
  jobs:
  - deployment: ApplyApprovedPlan
    environment: compute-${{ parameters.service }}-${{ parameters.environment }}
    pool:
      name: ${{ parameters.agentPool }}
      demands: Agent.OS -equals Windows_NT
    workspace:
      clean: all
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
            persistCredentials: false
          - download: none
          - task: DownloadPipelineArtifact@2
            inputs:
              buildType: current
              artifactName: approved-plan
              targetPath: $(Pipeline.Workspace)/approved-plan
          - task: PowerShell@2
            inputs:
              pwsh: true
              filePath: scripts/Install-Terraform.ps1
          - task: AzureCLI@2
            displayName: Terraform init and apply approved saved plan
            inputs:
              azureSubscription: ${{ parameters.serviceConnection }}
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $helper = Join-Path $env:BUILD_SOURCESDIRECTORY 'scripts/Invoke-Terraform.ps1'
                $artifactDirectory = Join-Path $env:PIPELINE_WORKSPACE 'approved-plan'
                & $helper -Service $env:SERVICE -Environment $env:TARGET_ENVIRONMENT -Operation apply -Phase Prepare -ArtifactDirectory $artifactDirectory
                terraform init -input=false -reconfigure -lockfile=readonly `
                  "-backend-config=resource_group_name=$env:STATE_RESOURCE_GROUP" `
                  "-backend-config=storage_account_name=$env:STATE_STORAGE_ACCOUNT" `
                  "-backend-config=container_name=$env:STATE_CONTAINER" `
                  "-backend-config=key=$env:TF_STATE_KEY" `
                  -backend-config=use_azuread_auth=true -backend-config=use_oidc=true
                if ($LASTEXITCODE) { throw 'Terraform backend init failed.' }
                # Verify the same-run plan, its hash/backend and destructive-plan policy first.
                & $helper -Service $env:SERVICE -Environment $env:TARGET_ENVIRONMENT -Operation apply -Phase VerifyPlan -ArtifactDirectory $artifactDirectory
                terraform apply -input=false -lock-timeout=120s "$artifactDirectory/platform.tfplan"
                if ($LASTEXITCODE) { throw 'Terraform apply failed.' }
              visibleAzLogin: false
            env:
              SERVICE: ${{ parameters.service }}
              TARGET_ENVIRONMENT: ${{ parameters.environment }}
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: $(AZURE_SERVICE_CONNECTION_ID)
              STATE_RESOURCE_GROUP: $(STATE_RESOURCE_GROUP)
              STATE_STORAGE_ACCOUNT: $(STATE_STORAGE_ACCOUNT)
              STATE_CONTAINER: $(STATE_CONTAINER)
              TF_SECRET_JSON: $(TF_SECRET_JSON)
