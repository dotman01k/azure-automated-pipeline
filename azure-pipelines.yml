trigger: none
pr: none
parameters:
- name: service
  type: string
  default: virtual-machines
  values: [aks, app-service, batch, container-apps, container-instances, functions, service-fabric, virtual-desktop, virtual-machines, vm-scale-sets]
- name: environment
  type: string
  default: dev
  values: [dev, prod]
- name: operation
  type: string
  default: plan
  values: [plan, apply]
- name: agentPool
  type: string
  default: InfraProject
- name: serviceConnection
  type: string
  default: sc-compute-dev
extends:
  template: pipelines/compute.yml
  parameters:
    service: ${{ parameters.service }}
    environment: ${{ parameters.environment }}
    operation: ${{ parameters.operation }}
    agentPool: ${{ parameters.agentPool }}
    serviceConnection: ${{ parameters.serviceConnection }}
